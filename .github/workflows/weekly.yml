name: مسودات زيادة الأسبوعية

# الكرون يعمل من الفرع الافتراضي فقط. هذا الملف لازم يكون في main،
# وإلا لن يشتغل أبداً بلا أي رسالة خطأ.
#
# الاعتماد أسبوعي: كل أسبوع تُنشأ مسودات وحدات الأسبوع القادم الثلاث
# (ثلاثاء/أربعاء/خميس)، فيراجعها المستخدم ويعتمدها في بفر مرة كل أسبوع.
# المواعيد بأوقات الذروة من content/schedule.yml: LinkedIn ثلاثاء/أربعاء
# صباحاً، Instagram/X مساءً، ولا LinkedIn يوم الخميس. 8 مسودات أسبوعياً.
# آمن على الخطة المجانية: سقف بفر عشر مسودات مجدولة لكل قناة.
on:
  schedule:
    # 00:00 UTC خميس = 03:00 الخميس بتوقيت الرياض. يجهّز مسودات الأسبوع
    # القادم قبل أحد النشر بثلاثة أيام، فعندك وقت للمراجعة.
    - cron: "0 0 * * 4"
  workflow_dispatch:
    inputs:
      week:
        description: "أحد أسبوع محدد (YYYY-MM-DD). اتركه فارغاً للأسبوع القادم"
        required: false
      date:
        description: "أو يوم واحد محدد (YYYY-MM-DD) بدل أسبوع كامل"
        required: false
      month:
        description: "أو شهر كامل (YYYY-MM) دفعةً واحدة"
        required: false
      dry_run:
        description: "يرندر ويرفع ويتحقق بلا كتابة في بفر"
        type: boolean
        default: false
      force:
        description: "يتجاوز فحص التكرار. احذف المسودات القديمة من بفر أولاً"
        type: boolean
        default: false

concurrency:
  group: weekly-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # للدفع. لا يحتاج توكن، GITHUB_TOKEN تلقائي.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المتطلبات
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: تهيئة git للدفع
        run: |
          git config user.name  "ziadah-social-bot"
          git config user.email "actions@github.com"

      - name: التشغيل
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--date ${{ inputs.date }}"
          elif [ -n "${{ inputs.month }}" ]; then
            ARGS="--month ${{ inputs.month }}"
          elif [ -n "${{ inputs.week }}" ]; then
            ARGS="--week ${{ inputs.week }}"
          fi
          # بلا وسائط: الوضع الافتراضي = الأسبوع القادم (أحد/ثلاثاء/خميس)
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "الوسائط: ${ARGS:-(الأسبوع القادم)}"
          python3 scripts/run_weekly.py $ARGS

      - name: ورقة مراجعة الشهر
        if: always()
        continue-on-error: true
        env:
          TZ: Asia/Riyadh
        run: |
          M=$(date -d "+7 days" +%Y-%m)
          python3 scripts/proof_sheet.py "$M" || true

      - name: رفع المخرجات للمعاينة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # ورقة المراجعة أول ما تفتحه: ملف واحد فيه التصاميم والنصوص
          name: slides-and-proof
          # canvas_full يعرض الشريحتين متجاورتين فتتأكد من الاتصال
          path: |
            out/proof-*.html
            out/**/*.png
          retention-days: 30
          if-no-files-found: warn
