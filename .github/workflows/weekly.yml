name: مسودات زيادة الشهرية

# الكرون يعمل من الفرع الافتراضي فقط. هذا الملف لازم يكون في main،
# وإلا لن يشتغل أبداً بلا أي رسالة خطأ.
#
# الاعتماد شهري: مرة في الشهر تُنشأ مسودات كل آحاد الشهر القادم دفعةً
# واحدة، فيراجعها المستخدم ويعتمدها في بفر مرة واحدة بدل كل أسبوع.
# آمن على الخطة المجانية: سقف بفر عشر مسودات مجدولة لكل قناة، وإيقاعنا
# منشور واحد لكل قناة أسبوعياً، فالشهر أربع أو خمس لكل قناة، دون السقف.
on:
  schedule:
    # 00:00 UTC يوم 25 = 03:00 يوم 25 بتوقيت الرياض. يجهّز مسودات الشهر
    # القادم قبل بدايته بأيام، فعندك متسع للمراجعة قبل أول أحد فيه.
    - cron: "0 0 25 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "شهر محدد (YYYY-MM) لإنشاء كل آحاده. اتركه فارغاً للشهر القادم"
        required: false
      date:
        description: "أو أحد واحد محدد (YYYY-MM-DD) بدل شهر كامل"
        required: false
      dry_run:
        description: "يرندر ويرفع ويتحقق بلا كتابة في بفر"
        type: boolean
        default: false
      force:
        description: "يتجاوز فحص التكرار. احذف المسودات القديمة من بفر أولاً"
        type: boolean
        default: false

concurrency:
  group: monthly-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # للدفع. لا يحتاج توكن، GITHUB_TOKEN تلقائي.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المتطلبات
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: تهيئة git للدفع
        run: |
          git config user.name  "ziadah-social-bot"
          git config user.email "actions@github.com"

      - name: التشغيل
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            # أحد واحد محدد يدوياً
            ARGS="--date ${{ inputs.date }}"
          elif [ -n "${{ inputs.month }}" ]; then
            # شهر محدد يدوياً
            ARGS="--month ${{ inputs.month }}"
          else
            # التشغيل المجدول: الشهر القادم كاملاً
            TARGET=$(TZ=Asia/Riyadh date -d "$(TZ=Asia/Riyadh date +%Y-%m-01) +1 month" +%Y-%m)
            ARGS="--month $TARGET"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "الوسائط: $ARGS"
          python3 scripts/run_weekly.py $ARGS

      - name: ورقة مراجعة الشهر
        if: always()
        continue-on-error: true
        env:
          TZ: Asia/Riyadh
        run: |
          # نفس شهر الدفعة: المحدد يدوياً إن وُجد، وإلا الشهر القادم
          if [ -n "${{ inputs.month }}" ]; then
            M="${{ inputs.month }}"
          elif [ -n "${{ inputs.date }}" ]; then
            M=$(date -d "${{ inputs.date }}" +%Y-%m)
          else
            M=$(date -d "$(date +%Y-%m-01) +1 month" +%Y-%m)
          fi
          python3 scripts/proof_sheet.py "$M" || true

      - name: رفع المخرجات للمعاينة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # ورقة المراجعة أول ما تفتحه: ملف واحد فيه التصاميم والنصوص
          name: slides-and-proof
          # canvas_full يعرض الشريحتين متجاورتين فتتأكد من الاتصال
          path: |
            out/proof-*.html
            out/**/*.png
          retention-days: 30
          if-no-files-found: warn
