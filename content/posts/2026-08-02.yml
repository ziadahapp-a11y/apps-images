    text: |
      التوقيت يبيع أكثر من الخصم.

      أغلب المتاجر تعالج ضعف متوسط قيمة الطلب بخصم أكبر. المشكلة غالباً
      ليست في حجم الخصم، بل في لحظة عرضه.

      عميلك يمر بلحظات محددة داخل متجرك: يتصفح تصنيفاً، يضيف منتجاً،
      يفتح السلة، يبدأ إتمام الطلب، ينهي الشراء. كل لحظة نيّة مختلفة،
      وتستحق اقتراحاً مختلفاً.

      زيادة تشغّل الاقتراح عند الحدث المناسب بدل عرضه على الجميع بنفس
      الطريقة. النتيجة تراكمياً: 20M+ مبيعات إضافية للمتاجر.

      www.ziadah.app

