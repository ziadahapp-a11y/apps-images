# مكتبة الهوكات ومصادر الترند
#
# الهوك هو أول سطر، وهو الذي يقرر إن كان البوست سيُقرأ أو يُمرَّر.
# هذي أنماط مثبتة لهذا الجمهور تحديداً، لا قوالب تُنسخ حرفياً:
# استخدم النمط وغيّر المضمون، وإلا صار محتواك متكرراً.

patterns:

  - id: cost-reframe
    name: إعادة تأطير التكلفة
    shape: "قبل ما تزيد <ميزانية>، افحص <رقم أرخص>"
    why: >-
      التاجر يفكر في الإعلان كحل أول. إعادة التأطير توقفه لأنها تقترح
      طريقاً أرخص لنفس الهدف لا هدفاً آخر.
    used: [same-traffic, white-friday-prep]

  - id: false-culprit
    name: المتهم الخطأ
    shape: "المشكلة ليست في <ما يظنه>، بل في <السبب الحقيقي>"
    why: تناقض مباشر مع اعتقاد سائد، فيولّد رغبة في التحقق.
    used: [moments, display-styles]

  - id: ignored-moment
    name: اللحظة المهملة
    shape: "أكثر لحظة مهملة في متجرك هي <لحظة محددة>"
    why: يكشف فرصة قائمة لا يحتاج التاجر بناءها من الصفر.
    used: [post-purchase]

  - id: two-customers
    name: عميلان
    shape: "<عميل أ> و<عميل ب> ليسا في نفس المرحلة"
    why: يجسّد التخصيص بشخصين بدل شرح مجرد للخوارزمية.
    used: [zeed-ai]

  - id: not-a-discount
    name: ليس خصماً
    shape: "<الشي> ليس خصماً، بل <إعادة تعريف>"
    why: يفصل بين تنازل عن الهامش وبين حافز لا يكلّف.
    used: [free-shipping, bundles]

  - id: three-failures
    name: ثلاث نقاط فشل
    shape: "<الشي> يفشل في واحدة من ثلاث، والفرق يغيّر العلاج"
    why: تشخيص عملي قابل للتطبيق فوراً، فيُحفظ ويُشارك.
    used: [funnel]

  - id: season-timing
    name: توقيت الموسم
    shape: "<الموسم> يُكسب في <شهر قبله> لا في <شهره>"
    why: يخلق إلحاحاً حقيقياً مبنياً على تقويم لا على ضغط مصطنع.
    used: [white-friday-prep, national-day]

  - id: not-goodbye
    name: ليس نهاية
    shape: "<حالة تبدو خسارة> لا تعني <الخسارة>"
    why: يحوّل مشكلة يعرفها التاجر إلى فرصة لم يرها.
    used: [replacement]

# ==========================================================================
# مصادر الترند المجانية
#
# لا توجد واجهة مجانية موثوقة لترندات X، فلا تبنِ عليها.
# هذي المصادر مجانية وتُقرأ بلا مفتاح:
# ==========================================================================

sources:
  - name: Google News RSS
    how: "news.google.com/rss/search?q=<الاستعلام>&hl=ar&gl=SA&ceid=SA:ar"
    queries:
      - "التجارة الإلكترونية السعودية"
      - "منصة زد"
      - "منصة سلة"
      - "المتاجر الإلكترونية السعودية"
      - "هيئة التجارة الإلكترونية"

  - name: مدونتا زد وسلة
    how: RSS من مدونة كل منصة
    why: تعلن المواسم والتحديثات قبل انتشارها، فتسبق الموجة لا تلحقها

  - name: Google Trends
    how: "pytrends بنطاق geo=SA"
    caveat: غير رسمي وقد يتغير سلوكه بلا إشعار

  - name: تقويم المواسم المحلي
    how: مضمّن في content/quarter.yml تحت occasions
    why: أدق مصدر لأنه معروف مسبقاً ولا يعتمد على شبكة

# ==========================================================================
# قاعدة الاستخدام
#
# الترند يخدم الرسالة ولا يقودها. إن لم تجد رابطاً حقيقياً بين الخبر
# وبين وظيفة في التطبيق، لا تركب الموجة: بوست مقحم يضر أكثر مما ينفع
# مع جمهور تجار يعرف مجاله.
# ==========================================================================
