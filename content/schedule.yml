# ==========================================================================
# جدول النشر | زيادة
#
# مبني على بيانات ذروة السعودية لا على تقدير:
#   - 64% من المنشورات الفائزة في السعودية نُشرت بين 7:30 و9:30 مساءً
#     (Sprout Social 2026). السبب: صلاتا المغرب والعشاء تخلقان "ذروة
#     ما بعد العشاء" بين 8 و11 مساءً لا توجد في الأسواق الغربية.
#   - لِنكدإن: 8–11 صباحاً الثلاثاء والأربعاء فقط. هاتان النافذتان
#     تمثلان 48% من تفاعل لِنكدإن الإقليمي. الجمعة والسبت 8% فقط
#     من الوصول المعتاد، أي إهدار لمحتوى B2B.
#   - انستقرام السعودية: 7–9 مساءً في أيام الأسبوع، والخميس يوم ذروة.
#
# ما صُحّح:
#   كان النظام ينشر لِنكدإن أحد 10ص، وهو خارج نافذة الذروة تماماً.
#   ودليل الأيجنت كان يضع إكس 9 صباحاً، فيفوّت ذروة المساء التي
#   تحمل أغلبية المنشورات الفائزة.
#
# البنية: ثلاث وحدات أسبوعياً، كل وحدة في يوم خاص، وكل منصة في
# نافذة ذروتها هي داخل ذلك اليوم.
# ==========================================================================

timezone: "Asia/Riyadh"

# أسبوع العمل السعودي أحد إلى خميس.
# الأحد والاثنين يوما تجهيز لا نشر (من دليل الأيجنت).
prep_days: [sunday, monday]

units_per_week: 3

schedule:

  - unit: 1
    day: tuesday
    day_offset: 2          # إزاحة من أحد الأسبوع
    posts:
      - channel: linkedin
        time: "10:00"
        why: "نافذة 8–11 ص الثلاثاء: 48% من تفاعل لِنكدإن الإقليمي"
      - channel: instagram
        time: "20:00"
        why: "ذروة ما بعد العشاء 7–9 م"
      - channel: twitter
        time: "21:00"
        why: "قلب نافذة 7:30–9:30 م التي تحمل 64% من الفائزين"

  - unit: 2
    day: wednesday
    day_offset: 3
    posts:
      - channel: linkedin
        time: "10:00"
        why: "الأربعاء ثاني أقوى يوم B2B في الخليج"
      - channel: instagram
        time: "20:00"
        why: "منتصف الأسبوع، تصفح مكثف"
      - channel: twitter
        time: "21:00"
        why: "ذروة المساء"

  - unit: 3
    day: thursday
    day_offset: 4
    posts:
      - channel: instagram
        time: "20:00"
        why: "الخميس يوم ذروة انستقرام في السعودية، بداية نهاية الأسبوع"
      - channel: twitter
        time: "21:00"
        why: "ذروة المساء"
    # لا لِنكدإن يوم الخميس: التفاعل B2B ينهار خارج ثلاثاء وأربعاء

# ==========================================================================
# الإجمالي: 8 منشورات أسبوعياً من سقف 10 في خطة بفر.
# الفائض احتياط للترند والمناسبات.
#
# ممنوع النشر:
#   - الجمعة والسبت على لِنكدإن: 8% فقط من الوصول المعتاد
#   - بين 2 و5 فجراً على أي منصة: صمت رقمي
#
# ملاحظة: هذي أرقام سوق عامة. بعد ستة أسابيع من النشر، اقرأ تحليلات
# بفر الفعلية وعدّل الأوقات على بياناتك أنت لا على المتوسط.
# ==========================================================================
