        إن كان عندك حد شحن مجاني الآن، افتح سلة متجرك كعميل وشوف: هل يظهر لك كم بقي؟

        اعرض للعميل كم بقي له على الشحن المجاني: فعّلها من لوحة متجرك في زد أو سلة.

