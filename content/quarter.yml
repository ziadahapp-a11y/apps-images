        إن كان الظهور منخفضاً، فالمشكلة في اللحظة التي اخترتها للتشغيل. إن كان الظهور عالياً والنقرات قليلة، فالمشكلة في المنتج المعروض أو في شكل النافذة. إن كانت النقرات عالية والتحويل منخفضاً، فالمشكلة خارج زيادة أصلاً: في صفحة المنتج أو السعر أو الشحن.

