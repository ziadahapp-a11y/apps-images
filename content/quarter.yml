        لهذا التقارير في زيادة على شكل قمع لا كأرقام منفصلة، فالقمع يقول لك أين تسقط بالضبط:

        ظهور منخفض يعني أن اللحظة التي اخترتها للتشغيل خطأ.
        ظهور عالٍ ونقرات قليلة يعني أن المنتج المعروض أو شكل النافذة هو المشكلة.
        نقرات عالية وتحويل منخفض يعني أن المشكلة خارج زيادة أصلاً: في صفحة المنتج أو السعر أو الشحن.

