      lead: "هي تعرف أنها ناسية شيئاً، وتنتظر من متجرك أن يذكّرها."
      caps_lead: "في هذا الموسم تحديداً"
      caps:
        - "الاقتراح يُقرأ مساعدةً لا إلحاحاً"
        - "حملة موسمية تشغّلها وتوقفها وحدها"
        - "بلا لمس إعدادات متجرك الدائمة"
      caps_note: "الأسرة تشتري مرة واحدة في هذا الموسم. من فاتته فاته لسنة."
    posts:
      linkedin: |
        موسم العودة للمدارس يختلف عن كل المواسم في شيء واحد: العميل يشتري قائمة لا قطعة.

        الأسرة تعرف أنها تحتاج عدة أشياء معاً، وتعرف أنها نسيت شيئاً منها، وتتوقع من المتجر أن يذكّرها. هذا يجعل الاقتراح خدمةً لا إلحاحاً، وهو أسهل سياق يعمل فيه رفع قيمة الطلب في السنة كلها.

        لكن الموسم قصير، والأسرة تشتري مرة واحدة ولا ترجع. فمن جهّز قبل الموجة يبيع، ومن جهّز أثناءها يشاهد.

        في زيادة الحملة الموسمية كيان مستقل: تنشئها بمحتوى الموسم، تشغّلها في فترته، وتوقفها بعده. إعداداتك الدائمة تبقى كما هي، فلا تخاف أن تعبث بمتجر يشتغل.

        جهّزها هذا الأسبوع من لوحة متجرك في زد أو سلة، لا في أسبوع الذروة.

        #العودة_للمدارس #التجارة_الإلكترونية #المواسم #زد #سلة
