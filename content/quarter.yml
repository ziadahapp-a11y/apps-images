        هذا الشخص ليس رفاهية. هو الفرق بين عميل يخرج بقطعة وعميل يخرج بثلاث. والمتاجر الكبيرة تعرف قيمته فتدفع رواتب فرق كاملة لأجله.

        متجرك الإلكتروني يفتح أربعاً وعشرين ساعة، ولا يوجد فيه أحد يقوم بهذا الدور. العميل يدخل، يختار، ويخرج. وحده.

