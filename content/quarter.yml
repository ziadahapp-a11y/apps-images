        الهواية تعتمد عليك كلياً: تبيع حين تكون حاضراً تردّ وترتّب وتقترح، وتتوقف حين تنشغل بعملك الأساسي أو تسافر أو تنام. أما المشروع فيقف على قدميه: يعمل حين لا تكون أمامه، ويكمل بعد أن تغلق الشاشة.

