# ==========================================================================
# خطة نشر ربع سنوية | زيادة
#
# البناء: كل وحدة تبدأ من واقع التاجر، تربط خاصية بطلعة يعيشها،
# وتنتهي بخطوة تفعيل. لا وحدة تنتهي بمعلومة.
#
# الفصول (حقل act):
#   recognition  يرى نفسه قبل أن يسمع اسم التطبيق. بلا رقم.
#   capability   قدرة كانت حكراً على من يملك فريقاً
#   objection    يذكر المانع صراحةً ويزيله
#   activation   خطوة واحدة قابلة للتنفيذ اليوم
#   occasion     موسم بتاريخ ثابت
#
# proof: capabilities افتراضياً. المشغّل يرفض شهراً أكثر من نصفه أرقام.
#
# قواعد ملتزمة: الأرقام المعتمدة فقط (20M+ مبيعات إضافية، 40M+ ظهور،
# 200K+ منتج إضافي، 1,500+ متجر) بلا اسم أي متجر، ولا سعر باقة، ولا
# ادّعاء "أكثر من 10 لحظات" فالموثق ثمان.
# ==========================================================================

