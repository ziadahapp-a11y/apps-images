# خطة نشر ربع سنوية | زيادة
#
# كل وحدة = شريحتان متصلتان + ثلاثة نصوص لثلاث قنوات.
# الوظيفة الأسبوعية تختار الوحدة التي تاريخها هو أحد الأسبوع القادم.
#
# قواعد ملتزم بها كل نص هنا:
#   - الأرقام المعتمدة فقط: 20M+ مبيعات إضافية، 40M+ ظهور،
#     200K+ منتج إضافي تم بيعه، 1,500+ متجر
#   - بلا ذكر اسم أي متجر
#   - بلا أي سعر باقة
#   - لحظات التشغيل ثمان فقط، لا "أكثر من 10"
#
# lit: العقدة المضيئة في ريل اللحظات. مسموح 4 أو 5 فقط، لأنهما
# الوحيدتان الواقعتان تحت الجوال فيصح وصل الخط الصاعد إليهما.
# 0 الرئيسية · 1 التصنيفات · 2 صفحة منتج · 3 إضافة للسلة
# 4 حذف من السلة · 5 فتح السلة · 6 بدء إتمام الطلب · 7 بعد الشراء
# ==========================================================================

