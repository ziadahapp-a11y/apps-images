  source_copy:
    instagram:
      cover: 'شاشة سوداء + جملة بيضاء: «متجرك يخسر كل يوم»'
      slides: '"تعرف وش هي الخسارة اللي ما تظهر في تقريرك؟


        الزائر اللي دخل متجرك… واشترى قطعة وحدة بس،

        وما أحد اقترح عليه قطعة ثانية تكمل طلبه.


        الطلب اللي كان جاهز… وانلغى بسبب تكلفة الشحن.


        العميل اللي اشترى مرة… وما رجع مرة ثانية.


        والزائر اللي أضاف منتجات للسلة… وطلع بدون ما يكمل الشراء.


        كل هذي مو بس فرص ضاعت…

        هذي خسارة مبيعات كانت قريبة جدًا منك، بس ما ظهرت لك كتقرير واضح.


        هنا يجي دور زيادة.



        تبي تعرف كيف؟

        اكتب لنا “زيادة” ونوريك وش فرص البيع المخفية داخل متجرك.'
      caption: 'الخسارة اللي ما تظهر في تقاريرك: بيع ما صار.

        الزائر جاك، اشترى قطعة، وطلع. وما أحد عرض عليه القطعة الثانية.'
      cta: علّق (حلّل) وأرسل لك الطريقة
    twitter:
      text: 'متجرك يخسر فلوس كل يوم وأنت ما تدري.


        مو لأن الزوار قليلين، ولا لأن الأسعار غالية.

        و العميل اللي جاك فعلاً، طلع بقطعة وحدة وما أحد عرض عليه الثانية.


        الخسارة ما تظهر في التقارير، لأنها بيع ما صار أصلاً.'
    tiktok:
      text: 0-2ث هوك مباشر للكاميرا • 2-8ث لقطة شاشة سلة فيها منتج واحد • 8-14ث رسم يوضح الفرصة الضايعة
        + رقم كبير • 14-20ث الحل في جملة + دعوة
    whatsapp:
      message: 'كل عام وأنت بخير 🇸🇦


        فخورين إننا نشتغل مع تجار سعوديين يبنون بأيديهم.

        بمناسبة اليوم الوطني، جهّزنا لك عرضاً خاصاً ساري لـ[المدة].


        تبي التفاصيل؟'
      timing: يوم 22 مساءً + يوم 23 صباحاً
