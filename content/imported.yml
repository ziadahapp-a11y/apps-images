      text: 0-2ث هوك مع الرقم على الشاشة • 2-10ث شرح بسيط بالرسم (سلة فيها منتج واحد) • 10-15ث الفرصة
        الضايعة • 15-18ث دعوة
    whatsapp:
      message: 'أهلاً [اسم التاجر] 👋


        موسم المدارس على الأبواب، وأغلب المتاجر تجهّز متأخرة.

