    instagram:
      cover: «5 منتجات لا تضعها أبداً في صفحة الدفع» — خط ضخم أبيض على خلفية داكنة
      slides: '1 غلاف • 2 القاعدة: صفحة الدفع مو معرض • 3 ❌ منتج غالي • 4 ❌ منتج بخيارات • 5 ❌ منتج موسمي
        ضعيف • 6 ❌ أكثر من عنصرين • 7 ❌ منتج بلا علاقة بالسلة • 8 ✅ الصح: عنصر واحد رخيص بنقرة + «احفظه»'
      caption: 'صفحة الدفع أغلى مساحة في متجرك، وأكثر وحدة نسيء استخدامها.

        خمسة منتجات لو حطيتها فيها، تخسر أكثر مما تكسب. والحل في الشريحة الأخيرة.'
      cta: احفظه قبل ما تجهّز عروضك
    twitter:
      text: '1) خمسة منتجات لا تحطها أبداً في صفحة الدفع. ثريد قصير يوفّر عليك مبيعات ضايعة:

        2) ❌ منتج غالي — يرجّع العميل لمرحلة التفكير من جديد.

        3) ❌ منتج له مقاسات أو خيارات — كل خيار احتمال تردد.

        4) ❌ منتج موسمي ضعيف المبيعات — مساحة ضايعة.

        5) ❌ أكثر من عنصرين — التشتيت يقتل الدفع.

        6) ✅ الصح: عنصر واحد رخيص وعام يُضاف بنقرة. لا أكثر.'
    tiktok:
      text: 0-3ث هوك • 3-14ث الأخطاء الخمسة بإيقاع سريع، خطأ كل ثانيتين مع ❌ • 14-19ث الحل الصح مع ✅ •
        19-22ث دعوة
