      cover: «نص طلباتك قطعة وحدة» — الرقم 50% بخط عملاق
      slides: '1 غلاف بالرقم • 2 معنى الرقم بلغة التاجر • 3 وش يعني نص عملائك يطلعون بقطعة • 4 الفرصة:
        ثلث المشترين يضيفون المكمّل بدون ما تعرضه • 5 لو عرضته وش يصير • 6 كيف تعرف رقمك أنت + «احفظه»'
      caption: نص طلباتك قطعة وحدة. مو لأن عملاءك ما يبون يشترون أكثر، لكن لأن ما أحد عرض عليهم.
      cta: احفظه واحسب رقمك
    twitter:
      text: '1) حلّلنا آلاف الطلبات في متجر تجزئة سعودي. الأرقام كشفت شي ما توقعه صاحب المتجر. ثريد:

        2) أكثر من نص الطلبات كانت قطعة وحدة بس. يعني نص عملائه يشترون منتج ويطلعون.

        3) بس الأهم: ثلث اللي اشتروا المنتج الأساسي أخذوا المكمّل الرخيص معه في نفس الطلب.

        4) والمفاجأة؟ هالربط ما كان معروض أصلاً. العميل كان يدوّر على الثاني بنفسه.

        5) الدرس: متجرك يقول لك وش يبون عملاؤك. المشكلة إن ما فيه أحد يقرأ البيانات.'
