    twitter:
      text: '1) خريطة ربط المنتجات في 6 خطوات. تطبّقها اليوم بإكسل بدون أي أداة:

        2) صدّر ملف طلباتك من لوحة متجرك.

        3) اعرف أي منتجين ظهروا في نفس رقم الطلب.

        4) احسب نسبة الإرفاق: من اشترى (أ)، كم نسبة منهم أخذ (ب)؟

        5) رتّب الأزواج من الأعلى نسبة للأدنى.

        6) حط الزوج الأقوى على صفحة المنتج الأكثر زيارة.

        7) راقب أسبوع: أوقف اللي تحت 10%، وضاعف اللي فوق 20%.'
