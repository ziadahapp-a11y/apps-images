<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/ibm_plex_arabic_embedded.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/cards.css">
<style>
  .stat2__store { font-size:19px; font-weight:700; color:var(--violet); margin-bottom:12px; }
  .stat2__n bdi { direction:ltr; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="pill"><i></i>{{PILL}}</div>
      <div class="brand">
        <div class="brand__tx"><div class="brand__ar">زيادة</div><div class="brand__en">ziadah</div></div>
        <div class="brand__mark"><!--MARK--></div>
      </div>
    </div>
    <div class="body">
      <div class="content">
        <div class="kicker">{{KICKER}}</div>
        <h1 class="title">{{TITLE}}</h1>
        <p class="desc">{{DESC}}</p>
        <div class="stat2">{{STAT2}}</div>
      </div>
      <div class="demo demo--side">
        <div class="demo__num" style="font-size:{{DEMO_NUM_FS}}px">{{DEMO_NUM}}</div>
        <div class="demo__label">{{DEMO_LABEL}}</div>
        <div class="demo__rule"></div>
        <div class="demo__ex">{{DEMO_EX}}</div>
        <div class="demo__extx">{{DEMO_EXTX}}</div>
      </div>
    </div>
    <div class="foot">
      <div class="foot__site">ziadah.app</div>
      <div class="foot__at">@ziadah_app</div>
    </div>
  </div>
</body>
</html>
