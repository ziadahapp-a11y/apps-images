<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>زيادة | بطاقة X</title>
<link rel="stylesheet" href="../brand/ibm_plex_arabic_embedded.css">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
/* ==========================================================================
   بطاقة X بمقاس 16:9 (1600x900 بإحداثيات CSS، تُصدَّر 3200x1800)

   ليش قالب مستقل ولا نعيد استخدام قالب 4:5:
   X يقصّ الصور الطويلة في معاينة الخط الزمني، فبطاقة 4:5 تخسر
   نصف تصميمها قبل أن يفتحها أحد. المقاس 16:9 هو الوحيد الذي يظهر
   كاملاً في سطح المكتب والجوال معاً.

   ولأن الارتفاع صار 900 بدل 1350، التخطيط يختلف جوهرياً: عمودان
   متجاوران بدل كتلة عمودية، والجوال يُقتصّ من أسفله عن قصد لأن
   المساحة لا تكفي إطاراً كاملاً.
   ========================================================================== */

.card {
  position: relative;
  width: 1600px;
  height: 900px;
  overflow: hidden;
  background: var(--ink);
}

.bg { position: absolute; inset: 0; }
.bg__base {
  position: absolute; inset: 0;
  background: linear-gradient(108deg, var(--ink-deep) 0%, var(--ink) 42%, #20053f 76%, #2a0763 100%);
}
.bg__glow {
  position: absolute; top: -40%; left: 46%;
  width: 1200px; height: 1200px; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(147,88,232,0.40) 0%, rgba(85,11,245,0.14) 38%, transparent 68%);
}
.bg__grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.026) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.026) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: radial-gradient(ellipse 72% 66% at 50% 42%, #000 0%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 72% 66% at 50% 42%, #000 0%, transparent 80%);
}

/* ---- الشعار ---- */
.logo-slot { position: absolute; top: 52px; right: 64px; }
.logo { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.logo__mark { width: 74px; }
.logo__mark svg { display: block; width: 100%; height: auto; }
.logo__ar { margin-top: 11px; font-size: 36px; font-weight: 700; letter-spacing: -0.015em; color: var(--on-dark); }
.logo__en { margin-top: 6px; font-size: 14px; font-weight: 500; letter-spacing: 0.28em; color: var(--on-dark-muted); }

/* ---- العمود النصي، يمين لأن الاتجاه RTL ---- */
.copy { position: absolute; top: 236px; right: 64px; width: 780px; }

.badge {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 11px 24px; border-radius: var(--r-pill);
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  font-size: 20px; font-weight: 600; color: var(--violet-soft);
}

.title {
  margin-top: 26px;
  font-size: 78px; font-weight: 700;
  line-height: 1.16; letter-spacing: -0.035em;
  color: var(--on-dark);
}

.lead {
  margin-top: 22px; width: 720px;
  font-size: 28px; font-weight: 300; line-height: 1.4;
  color: var(--on-dark-muted);
}

/* ---- العمود البصري ---- */
.visual { position: absolute; left: 64px; top: 0; width: 640px; height: 100%; }

.stat { position: absolute; top: 148px; left: 0; width: 300px; }
.stat__num { font-size: 104px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; color: var(--on-dark); }
.stat__label { margin-top: 16px; font-size: 25px; font-weight: 400; line-height: 1.34; color: var(--on-dark-muted); }
.caps { position: absolute; top: 140px; left: 0; width: 300px; }
.caps__lead { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.24; color: var(--on-dark); }
.caps__list { margin-top: 26px; display: flex; flex-direction: column; gap: 18px; }
.cap { display: flex; align-items: flex-start; gap: 12px; }
.cap__tick { flex: 0 0 auto; width: 27px; height: 27px; border-radius: 50%; background: var(--green);
  position: relative; margin-top: 1px; box-shadow: 0 0 0 5px rgba(95,194,106,0.14); }
.cap__tick::after { content: ""; position: absolute; left: 8px; top: 7px; width: 10px; height: 5px;
  border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg); }
.cap__text { font-size: 21px; font-weight: 500; line-height: 1.42; color: var(--on-dark); }

.stat__rule { margin-top: 24px; width: 72px; height: 4px; border-radius: 2px; background: var(--grad-brand); }

/* الجوال يُقتصّ من أسفله عن قصد: الارتفاع 900 لا يكفي إطاراً كاملاً،
   والقص من الأسفل يترك النافذة كاملة وهي الجزء الذي يحمل المعنى */
.phone {
  position: absolute; left: 330px; top: 118px;
  width: 300px; height: 660px;
  border-radius: 40px; background: #05010d; padding: 9px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 40px 80px rgba(0,0,0,0.55),
              0 0 70px rgba(85,11,245,0.24);
}
.phone__screen { position: relative; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: #fff; }
.phone__island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  width: 70px; height: 20px; border-radius: 999px; background: #05010d; z-index: 6; }

.store { padding: 40px 13px 0; }
.store__bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; }
.store__name { font-size: 14px; font-weight: 600; color: var(--ink); }
.store__icons { display: flex; gap: 6px; }
.store__icons i { display: block; width: 14px; height: 14px; border-radius: 4px; background: #ebe5fa; }
.store__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.store__card { height: 96px; border-radius: 10px; background: linear-gradient(150deg, var(--tint), #ddd2fb); }

.scrim { position: absolute; inset: 0; background: rgba(15,2,34,0.56); z-index: 2; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  background: #fff; border-radius: 20px 20px 0 0; padding: 11px 14px 16px;
  box-shadow: 0 -16px 40px rgba(15,2,34,0.34);
}
.sheet__handle { width: 34px; height: 4px; border-radius: 2px; background: #ddd4f4; margin: 0 auto 12px; }
.sheet__title { font-size: 17px; font-weight: 700; color: var(--ink); }
.sheet__sub { margin-top: 3px; font-size: 12px; color: var(--on-light-muted); }

.item { display: flex; align-items: center; gap: 9px; padding: 10px 0; border-bottom: 1px solid #f2eefb; }
.item__thumb { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 10px;
  background: linear-gradient(145deg, var(--violet-glow), var(--violet)); position: relative; }
.item__thumb::after { content: ""; position: absolute; inset: 14px; border-radius: 6px; background: rgba(255,255,255,0.32); }
.item__body { flex: 1 1 auto; min-width: 0; }
.item__name { font-size: 14px; font-weight: 600; color: var(--ink); }
.item__prices { margin-top: 4px; display: flex; align-items: center; gap: 7px; }
.item__now { font-size: 14px; font-weight: 700; color: var(--violet); }
.item__off { font-size: 10px; font-weight: 600; color: #2f7d3a;
  background: rgba(95,194,106,0.18); border-radius: 5px; padding: 2px 6px; }
.item__add { flex: 0 0 auto; width: 27px; height: 27px; border-radius: 9px;
  background: var(--violet); color: #fff; font-size: 17px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; }

.cta {
  margin-top: 11px; height: 40px; border-radius: 12px;
  background: var(--grad-brand); color: #fff; font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 20px rgba(85,11,245,0.40);
}

/* ---- الشريط السفلي ---- */
.footline { position: absolute; left: 0; bottom: 86px; width: 1600px; height: 1px;
  background: linear-gradient(to right, transparent, var(--hairline) 12%, var(--hairline) 88%, transparent); }
.foot { position: absolute; bottom: 34px; font-size: 22px; font-weight: 400; color: var(--on-dark-muted); }
.foot--r { right: 64px; }
.foot--l { left: 64px; }
</style>
</head>
<body>

<div class="card" id="card">

  <div class="bg">
    <div class="bg__base"></div>
    <div class="bg__grid"></div>
    <div class="bg__glow"></div>
  </div>

  <div class="logo-slot">
    <div class="logo">
      <div class="logo__mark"><!--MARK--></div>
      <div class="logo__ar">زيادة</div>
      <div class="logo__en">ziadah</div>
    </div>
  </div>

  <div class="copy">
    <div class="badge">✦ {{BADGE}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <p class="lead">{{LEAD}}</p>
  </div>

  <div class="visual">
    <!--PROOF:stat-->
    <div class="stat">
      <div class="stat__num"><bdi>{{STAT_NUM}}</bdi></div>
      <div class="stat__label">{{STAT_LABEL}}</div>
      <div class="stat__rule"></div>
    </div>
    <!--/PROOF:stat-->

    <!--PROOF:capabilities-->
    <div class="caps">
      <div class="caps__lead">{{CAPS_LEAD}}</div>
      <div class="caps__list">{{CAPS_LIST}}</div>
    </div>
    <!--/PROOF:capabilities-->

    <div class="phone">
      <div class="phone__screen">
        <div class="phone__island"></div>
        <div class="store">
          <div class="store__bar">
            <div class="store__name">سلة العميل</div>
            <div class="store__icons"><i></i><i></i></div>
          </div>
          <div class="store__grid">
            <div class="store__card"></div><div class="store__card"></div>
            <div class="store__card"></div><div class="store__card"></div>
          </div>
        </div>
        <div class="scrim"></div>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <div class="sheet__title">{{SHEET_TITLE}}</div>
          <div class="sheet__sub">{{SHEET_SUB}}</div>
          <div class="item">
            <div class="item__thumb"></div>
            <div class="item__body">
              <div class="item__name">سماعة لاسلكية</div>
              <div class="item__prices">
                <span class="item__now"><bdi>119</bdi> ريال</span>
                <span class="item__off">وفّر <bdi>20%</bdi></span>
              </div>
            </div>
            <div class="item__add">+</div>
          </div>
          <div class="cta">{{SHEET_CTA}}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footline"></div>
  <div class="foot foot--r">التطبيق متاح على منصة زد ومنصة سلة</div>
  <div class="foot foot--l">www.ziadah.app</div>

</div>
</body>
</html>
