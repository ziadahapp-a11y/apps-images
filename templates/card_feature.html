<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/ibm_plex_arabic_embedded.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/cards.css">
<link rel="stylesheet" href="../brand/livescreen.css">
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="pill"><i></i>{{PILL}}</div>
      <div class="brand">
        <div class="brand__tx"><div class="brand__ar">زيادة</div><div class="brand__en">ziadah</div></div>
        <div class="brand__mark"><!--MARK--></div>
      </div>
    </div>

    <div class="body">
      <div class="content">
        <div class="icon">{{ICON}}</div>
        <div class="kicker">{{KICKER}}</div>
        <h1 class="title">{{TITLE}}</h1>
        <p class="desc">{{DESC}}</p>
        <div class="checks">{{CHECKS}}</div>
        <div class="statline"><span class="statline__n"><bdi>{{DEMO_NUM}}</bdi></span><span class="statline__l">{{DEMO_LABEL}}</span></div>
      </div>

      <div class="stage" style="flex:0 0 470px; align-self:stretch;">
        <div class="holo__grid"></div><div class="holo"></div><div class="holo__ring"></div>
        <div class="phone" style="width:346px; height:706px;">
          <div class="screen">
            <div class="island"></div>
            <div class="sheen"></div>
            {{SCREEN}}
          </div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="foot__site">ziadah.app</div>
      <div class="foot__at">@ziadah_app</div>
    </div>
  </div>
</body>
</html>
