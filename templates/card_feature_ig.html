<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/ibm_plex_arabic_embedded.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/cards_ig.css">
<link rel="stylesheet" href="../brand/livescreen.css">
<style>
  .statline { margin-top:20px; display:inline-flex; align-items:baseline; gap:12px;
    background:rgba(85,11,245,0.08); border:1px solid rgba(85,11,245,0.18); border-radius:14px; padding:12px 22px; }
  .statline__n { direction:ltr; font-size:40px; font-weight:700; color:var(--violet); line-height:1; }
  .statline__n bdi { direction:ltr; }
  .statline__l { font-size:24px; font-weight:600; color:rgba(28,4,52,0.6); }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="pill"><i></i>{{PILL}}</div>
      <div class="brand">
        <div class="brand__tx"><div class="brand__ar">زيادة</div><div class="brand__en">ziadah</div></div>
        <div class="brand__mark"><!--MARK--></div>
      </div>
    </div>

    <div style="margin-top:44px">
      <div class="kicker">{{KICKER}}</div>
      <h1 class="title" style="font-size:70px">{{TITLE_IG}}</h1>
      <div class="statline"><span class="statline__n"><bdi>{{DEMO_NUM}}</bdi></span><span class="statline__l">{{DEMO_LABEL_IG}}</span></div>
    </div>

    <div class="stage" style="flex:1; margin-top:8px;">
      <div class="holo__grid"></div><div class="holo"></div><div class="holo__ring"></div>
      <div class="phone" style="width:356px; height:726px;">
        <div class="screen">
          <div class="island"></div>
          <div class="sheen"></div>
          {{SCREEN}}
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="foot__site">ziadah.app</div>
      <div class="foot__at">@ziadah_app</div>
    </div>
  </div>
</body>
</html>
