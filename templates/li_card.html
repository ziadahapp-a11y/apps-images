<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>زيادة | بطاقة لنكدن</title>
<link rel="stylesheet" href="../brand/ibm_plex_arabic_embedded.css">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
/* ==========================================================================
   بطاقة لنكدن أفقية 1.91:1 (1200x627 بإحداثيات CSS، تُصدَّر 2400x1254)

   لنكدن يعتمد للصورة المفردة المقاس الأفقي 1200x627. عمودان فقط:
   الجوال يساراً، والخطاف (شارة + عنوان + وصف) يميناً بعرض كامل.

   ليش بلا كتلة إثبات (رقم/قدرات): الأفقي القصير (627) لا يتسع لعمود
   ثالث بلا ازدحام أو قص، والتفصيل الرقمي يعيش في نص المنشور نفسه.
   البطاقة تحمل الخطاف والتوقيع البصري (نافذة زيادة على الجوال)، وهو
   ما يميّز الهوية في الخط الزمني.
   ========================================================================== */

.card {
  position: relative;
  width: 1200px;
  height: 627px;
  overflow: hidden;
  background: var(--ink);
}

.bg { position: absolute; inset: 0; }
.bg__base {
  position: absolute; inset: 0;
  background: linear-gradient(108deg, var(--ink-deep) 0%, var(--ink) 44%, #20053f 78%, #2a0763 100%);
}
.bg__glow {
  position: absolute; top: -42%; left: 50%;
  width: 940px; height: 940px; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(147,88,232,0.38) 0%, rgba(85,11,245,0.13) 40%, transparent 70%);
}
.bg__grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.026) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.026) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 76% 72% at 54% 42%, #000 0%, transparent 82%);
  -webkit-mask-image: radial-gradient(ellipse 76% 72% at 54% 42%, #000 0%, transparent 82%);
}

/* ---- الشعار ---- */
.logo-slot { position: absolute; top: 42px; right: 60px; }
.logo { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.logo__mark { width: 60px; }
.logo__mark svg { display: block; width: 100%; height: auto; }
.logo__ar { margin-top: 9px; font-size: 29px; font-weight: 700; letter-spacing: -0.015em; color: var(--on-dark); }
.logo__en { margin-top: 5px; font-size: 11px; font-weight: 500; letter-spacing: 0.28em; color: var(--on-dark-muted); }

/* ---- عمود النص، يمين بعرض كامل ---- */
.copy { position: absolute; top: 168px; right: 60px; width: 700px; }

.badge {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 10px 22px; border-radius: var(--r-pill);
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  font-size: 18px; font-weight: 600; color: var(--violet-soft);
}

.title {
  margin-top: 24px;
  font-size: 58px; font-weight: 700;
  line-height: 1.14; letter-spacing: -0.034em;
  color: var(--on-dark);
}

.lead {
  margin-top: 20px; width: 648px;
  font-size: 23px; font-weight: 300; line-height: 1.42;
  color: var(--on-dark-muted);
}

/* ---- الجوال، أقصى اليسار، مقتصّ من أسفله ---- */
.phone {
  position: absolute; left: 64px; top: 92px;
  width: 244px; height: 516px;
  border-radius: 36px; background: #05010d; padding: 8px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 36px 70px rgba(0,0,0,0.55),
              0 0 60px rgba(85,11,245,0.24);
}
.phone__screen { position: relative; width: 100%; height: 100%; border-radius: 28px; overflow: hidden; background: #fff; }
.phone__island { position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
  width: 58px; height: 18px; border-radius: 999px; background: #05010d; z-index: 6; }

.store { padding: 36px 12px 0; }
.store__bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.store__name { font-size: 13px; font-weight: 600; color: var(--ink); }
.store__icons { display: flex; gap: 5px; }
.store__icons i { display: block; width: 13px; height: 13px; border-radius: 4px; background: #ebe5fa; }
.store__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.store__card { height: 82px; border-radius: 10px; background: linear-gradient(150deg, var(--tint), #ddd2fb); }

.scrim { position: absolute; inset: 0; background: rgba(15,2,34,0.56); z-index: 2; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  background: #fff; border-radius: 19px 19px 0 0; padding: 11px 13px 16px;
  box-shadow: 0 -14px 34px rgba(15,2,34,0.34);
}
.sheet__handle { width: 32px; height: 4px; border-radius: 2px; background: #ddd4f4; margin: 0 auto 12px; }
.sheet__title { font-size: 16px; font-weight: 700; color: var(--ink); }
.sheet__sub { margin-top: 3px; font-size: 12px; color: var(--on-light-muted); }

.item { display: flex; align-items: center; gap: 9px; padding: 10px 0; border-bottom: 1px solid #f2eefb; }
.item__thumb { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 10px;
  background: linear-gradient(145deg, var(--violet-glow), var(--violet)); position: relative; }
.item__thumb::after { content: ""; position: absolute; inset: 13px; border-radius: 5px; background: rgba(255,255,255,0.32); }
.item__body { flex: 1 1 auto; min-width: 0; }
.item__name { font-size: 13px; font-weight: 600; color: var(--ink); }
.item__prices { margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.item__now { font-size: 13px; font-weight: 700; color: var(--violet); }
.item__off { font-size: 10px; font-weight: 600; color: #2f7d3a;
  background: rgba(95,194,106,0.18); border-radius: 4px; padding: 2px 6px; }
.item__add { flex: 0 0 auto; width: 25px; height: 25px; border-radius: 8px;
  background: var(--violet); color: #fff; font-size: 16px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; }

.cta {
  margin-top: 11px; height: 38px; border-radius: 11px;
  background: var(--grad-brand); color: #fff; font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(85,11,245,0.40);
}

/* ---- الشريط السفلي ---- */
.foot { position: absolute; bottom: 34px; font-size: 19px; font-weight: 400; color: var(--on-dark-muted); }
.foot--r { right: 60px; }
</style>
</head>
<body>

<div class="card" id="card">

  <div class="bg">
    <div class="bg__base"></div>
    <div class="bg__grid"></div>
    <div class="bg__glow"></div>
  </div>

  <div class="logo-slot">
    <div class="logo">
      <div class="logo__mark"><!--MARK--></div>
      <div class="logo__ar">زيادة</div>
      <div class="logo__en">ziadah</div>
    </div>
  </div>

  <div class="copy">
    <div class="badge">✦ {{BADGE}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <p class="lead">{{LEAD}}</p>
  </div>

  <div class="phone">
    <div class="phone__screen">
      <div class="phone__island"></div>
      <div class="store">
        <div class="store__bar">
          <div class="store__name">سلة العميل</div>
          <div class="store__icons"><i></i><i></i></div>
        </div>
        <div class="store__grid">
          <div class="store__card"></div><div class="store__card"></div>
          <div class="store__card"></div><div class="store__card"></div>
        </div>
      </div>
      <div class="scrim"></div>
      <div class="sheet">
        <div class="sheet__handle"></div>
        <div class="sheet__title">{{SHEET_TITLE}}</div>
        <div class="sheet__sub">{{SHEET_SUB}}</div>
        <div class="item">
          <div class="item__thumb"></div>
          <div class="item__body">
            <div class="item__name">سماعة لاسلكية</div>
            <div class="item__prices">
              <span class="item__now"><bdi>119</bdi> ريال</span>
              <span class="item__off">وفّر <bdi>20%</bdi></span>
            </div>
          </div>
          <div class="item__add">+</div>
        </div>
        <div class="cta">{{SHEET_CTA}}</div>
      </div>
    </div>
  </div>

  <div class="foot foot--r">التطبيق متاح على منصة زد ومنصة سلة</div>

</div>
</body>
</html>
