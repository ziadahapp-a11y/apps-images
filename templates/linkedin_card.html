<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>زيادة | بطاقة لنكدن</title>
<link rel="stylesheet" href="../brand/ibm_plex_arabic_embedded.css">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
/* بطاقة لنكدن 1200×627 (1.91:1). بانر أفقي قصير: هوك يمين، إثبات
   رقمي يسار. الارتفاع قصير فلا ريل، والتوقيع خط الهوية المتدرّج. */
.card { position: relative; width: 1200px; height: 627px; overflow: hidden; background: var(--ink); }
.bg { position: absolute; inset: 0; }
.bg__base { position: absolute; inset: 0;
  background: linear-gradient(110deg, var(--ink-deep) 0%, var(--ink) 44%, #20053f 82%, #2a0763 100%); }
.bg__glow { position: absolute; top: -46%; left: 32%;
  width: 820px; height: 820px; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(147,88,232,0.40) 0%, rgba(85,11,245,0.14) 40%, transparent 68%); }
.bg__corner { position: absolute; bottom: -52%; left: 97%;
  width: 560px; height: 560px; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(85,11,245,0.26) 0%, transparent 66%); }
.bg__grid { position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.022) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.022) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: radial-gradient(ellipse 74% 70% at 50% 36%, #000 0%, transparent 82%);
  -webkit-mask-image: radial-gradient(ellipse 74% 70% at 50% 36%, #000 0%, transparent 82%); }

.slide__logo { position: absolute; top: 46px; right: 52px; }
.logo__mark { width: 68px; }
.logo__ar { font-size: 42px; margin-top: 12px; }
.logo__en { font-size: 17px; margin-top: 7px; letter-spacing: 0.28em; }

.hook { position: absolute; right: 52px; top: 158px; width: 600px; }
.badge { display: inline-flex; align-items: center; gap: 9px;
  padding: 10px 22px; border-radius: var(--r-pill);
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  font-size: 22px; font-weight: 600; color: var(--violet-soft); }
.hook__title { margin-top: 24px; font-size: 58px; font-weight: 700;
  line-height: 1.14; letter-spacing: -0.03em; color: var(--on-dark); }
.hook__lead { margin-top: 20px; width: 560px; font-size: 27px; font-weight: 300;
  line-height: 1.36; color: var(--on-dark-muted); }

.stat { position: absolute; left: 52px; top: 176px; width: 420px; }
.stat__num { font-size: 120px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; color: var(--on-dark); }
.stat__label { margin-top: 18px; font-size: 28px; font-weight: 400; line-height: 1.3; color: var(--on-dark-muted); }
.stat__rule { margin-top: 26px; width: 80px; height: 4px; border-radius: 2px; background: var(--grad-brand); }
.stat__second { margin-top: 26px; }
.stat__second-num { font-size: 46px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; color: var(--violet-soft); display: inline-block; }
.stat__second-label { margin-top: 8px; font-size: 23px; font-weight: 400; color: var(--on-dark-muted); }

.foot { position: absolute; bottom: 30px; right: 52px; font-size: 22px; font-weight: 400; color: var(--on-dark-muted); }
.foot--left { right: auto; left: 52px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bg">
    <div class="bg__base"></div><div class="bg__grid"></div>
    <div class="bg__glow"></div><div class="bg__corner"></div>
  </div>

  <div class="slide__logo">
    <div class="logo"><div class="logo__mark"><!--MARK--></div>
      <div class="logo__ar">زيادة</div><div class="logo__en">ziadah</div></div>
  </div>

  <div class="hook">
    <div class="badge chk" data-name="badge">✦ {{BADGE}}</div>
    <h1 class="hook__title chk" data-name="title">{{TITLE}}</h1>
    <p class="hook__lead chk" data-name="lead">{{LEAD}}</p>
  </div>

  <div class="stat">
    <div class="stat__num chk" data-name="stat_num"><bdi>{{STAT_NUM}}</bdi></div>
    <div class="stat__label chk" data-name="stat_label">{{STAT_LABEL}}</div>
    <div class="stat__rule"></div>
    <div class="stat__second">
      <span class="stat__second-num"><bdi>{{STAT2_NUM}}</bdi></span>
      <div class="stat__second-label">{{STAT2_LABEL}}</div>
    </div>
  </div>

  <div class="foot">www.ziadah.app</div>
  <div class="foot foot--left">منصتا زد وسلة</div>
</div>
</body>
</html>
