<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/ibm_plex_arabic_embedded.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/cards.css">
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="pill"><i></i>{{PILL}}</div>
      <div class="brand">
        <div class="brand__tx"><div class="brand__ar">زيادة</div><div class="brand__en">ziadah</div></div>
        <div class="brand__mark"><!--MARK--></div>
      </div>
    </div>
    <div style="margin-top:30px">
      <div class="kickerC">{{KICKERC}}</div>
      <div class="titleC">{{TITLE}}</div>
    </div>
    <div class="cols">
      <div class="col col--after">
        <div class="col__hd"><span class="col__tag">بعد زيادة</span></div>
        {{AFTER_ROWS}}
      </div>
      <div class="col col--now">
        <div class="col__hd"><span class="col__tag">وضعك الحالي</span></div>
        {{NOW_ROWS}}
      </div>
    </div>
    <div class="foot">
      <div class="foot__site">ziadah.app</div>
      <div class="foot__at">@ziadah_app</div>
    </div>
  </div>
</body>
</html>
